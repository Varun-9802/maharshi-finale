name: Maharshi checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maharshi-main
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      NEXT_PUBLIC_MAHARSHI_AI_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maharshi-main/package-lock.json
      - run: npm ci
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m compileall -q maharshi-ai
      - name: Install AI backend dependencies
        run: pip install -r maharshi-ai/requirements.txt
      - name: Load model and run one inference
        working-directory: maharshi-ai
        run: python smoke_test.py


  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create project ZIP
        run: |
          zip -r Maharshi-Final-Project.zip . \
            -x ".git/*" "*/node_modules/*" "*/.next/*" "*/venv/*" "*/__pycache__/*" "*.pyc" "*/.env.local" "*/.env" "*/.env.*"
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Maharshi-Final-Project
          path: Maharshi-Final-Project.zip
          retention-days: 7
